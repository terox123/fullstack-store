global:
  scrape_interval: 10s
  evaluation_interval: 10s

scrape_configs:

  - job_name: prometheus
    static_configs:
      - targets:
          - prometheus:9090

  - job_name: orders-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - orders-service:8080

  - job_name: product-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - product-service:8081